<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Report</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 2rem;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .file-section {
            margin-bottom: 4rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 2rem;
        }
        .card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 2rem;
        }
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin-bottom: 2rem;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th, td { text-align: left; padding: 0.75rem; border-bottom: 1px solid #e2e8f0; }
        th { background: #f1f5f9; position: sticky; top: 0; }
        tbody tr:hover { background-color: #f1f5f9; }
        .tag {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: #e2e8f0;
        }
        .filter-info {
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-filter {
            font-size: 0.75rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: underline;
            display: none;
        }
        h2 { border-left: 4px solid var(--primary); padding-left: 1rem; margin-bottom: 1.5rem; }
        dialog {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            padding: 2rem;
            max-width: 400px;
            width: 100%;
        }
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1rem;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            font-size: 0.875rem;
        }
        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .income-tooltip-container {
            position: relative;
            display: inline-block;
        }
        .income-tooltip-text {
            visibility: hidden;
            width: max-content;
            background-color: #1e293b;
            color: #fff;
            text-align: left;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 10;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 0.875rem;
            font-weight: 400;
            white-space: pre-wrap;
            pointer-events: none;
        }
        .income-tooltip-container:hover .income-tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .month-col {
            flex: 1 0 450px;
            max-width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .month-col { flex: 1 0 100%; min-width: 0; }
            .chart-container { height: 300px; }
            .header-controls { flex-direction: column; align-items: flex-start !important; gap: 1rem !important; }
            .header-title-container { flex-direction: column; align-items: flex-start !important; gap: 1rem; }
        }
        __STANDALONE_CSS__
    </style>
</head>
<body>
    <div class="container" id="reportContainer">
        <div id="duplicatesWarningContainer" class="hide-in-standalone"></div>
        <div class="header-title-container" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <h1 style="margin: 0;">Monthly Spending Analysis</h1>
            <div class="header-controls" style="display: flex; gap: 1.5rem; align-items: center;">
                <div class="report-controls hide-in-standalone" style="__REPORT_BTN_STYLE__ gap: 0.5rem;">
                    <select id="monthSelector" style="padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 0.875rem;">
                        <option value="">Select a Month...</option>
                    </select>
                    <button class="btn btn-primary" onclick="generateReport()">Generate Standalone Report</button>
                </div>
                <div style="display: flex; gap: 0.5rem; background: #e2e8f0; padding: 0.35rem; border-radius: 8px;">
                    <button id="btn-pie" class="btn btn-primary" style="box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);" onclick="setChartType('pie')">Pie Chart</button>
                    <button id="btn-sankey" class="btn btn-cancel" onclick="setChartType('sankey')">Cash Flow</button>
                    <button id="btn-bar" class="btn btn-cancel hide-in-standalone" onclick="setChartType('bar')">Raw Values</button>
                </div>
            </div>
        </div>
    </div>
    <div id="month-filter-container-placeholder"></div>
    <div id="dynamicContent"></div>

    <dialog id="editModal">
        <h3 style="margin-top: 0; margin-bottom: 1rem;">Edit Transaction</h3>
        <p id="modalDesc" style="margin-bottom: 1rem; white-space: pre-wrap; font-size: 0.875rem;"></p>
        <label style="font-size: 0.75rem; font-weight: bold; color: #475569;">New Category</label>
        <input type="text" id="modalCategoryInput" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
        <label style="font-size: 0.75rem; font-weight: bold; color: #475569;">New Name (Rename)</label>
        <input type="text" id="modalNameInput" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
        <label style="font-size: 0.75rem; font-weight: bold; color: #475569;">Match Substring (for "All Future")</label>
        <input type="text" id="modalMatchInput" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" onclick="applyEdit('all')">All Future</button>
        </div>
    </dialog>

    <dialog id="removeModal">
        <h3 style="margin-top: 0; margin-bottom: 1rem;">Remove Transaction</h3>
        <p id="removeModalDesc" style="margin-bottom: 1rem; white-space: pre-wrap; font-size: 0.875rem;"></p>
        <label style="font-size: 0.75rem; font-weight: bold; color: #475569;">Match Substring (for "All Matching")</label>
        <input type="text" id="removeMatchInput" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeRemoveModal()">Cancel</button>
            <button class="btn btn-primary" style="background: #ef4444;" onclick="applyRemove('all')">All Matching</button>
        </div>
    </dialog>

    <dialog id="moveModal">
        <h3 style="margin-top: 0; margin-bottom: 1rem;">Move Transaction</h3>
        <p id="moveModalDesc" style="margin-bottom: 1rem; white-space: pre-wrap; font-size: 0.875rem;"></p>
        <label style="font-size: 0.75rem; font-weight: bold; color: #475569;">Target Month (YYYY-MM)</label>
        <input type="text" id="moveModalInput" placeholder="e.g., 2026-02" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box;">
        <div class="modal-buttons">
            <button class="btn btn-cancel" onclick="closeMoveModal()">Cancel</button>
            <button class="btn btn-primary" onclick="applyMove()">Move</button>
        </div>
    </dialog>

    <script>
        Chart.register(ChartDataLabels);

        const overrides = __OVERRIDES_JSON__;
        let allData = __DATA_JSON__;
        let duplicatesData = __DUPLICATES_JSON__;
        const reportContainer = document.getElementById('reportContainer');
        const dynamicContent = document.getElementById('dynamicContent');
        let chartInstances = {};
        let currentChartType = 'pie';
        let currentFilters = {};
        let currentSorts = {};
        let activeMonths = new Set();
        const colorPalette = [
            '#2563eb', '#7c3aed', '#db2777', '#ea580c', '#16a34a', '#ca8a04', '#475569',
            '#06b6d4', '#8b5cf6', '#ec4899', '#f43f5e', '#14b8a6', '#f59e0b', '#3b82f6'
        ];

        function formatCurrency(val) {
            const absVal = Math.abs(val);
            const str = absVal >= 1000 ? (absVal / 1000).toFixed(1) + 'k' : absVal.toFixed(0);
            return val < 0 ? '-$' + str : '$' + str;
        }

        function truncateDesc(desc) {
            return desc.length > 20 ? desc.substring(0, 20) + '...' : desc;
        }

    function syncBarCharts() {
        let globalMax = 0;
        Object.keys(chartInstances).forEach(fileIdx => {
            const chart = chartInstances[fileIdx];
            if (chart.config.type !== 'bar') return;
            if (!activeMonths.has(allData[fileIdx].month)) return;

            chart.data.datasets[0].data.forEach((val, i) => {
                if (chart.getDataVisibility(i)) {
                    if (val > globalMax) globalMax = val;
                }
            });
        });

        const maxVal = globalMax > 0 ? globalMax * 1.05 : undefined;
        Object.values(chartInstances).forEach(chart => {
            if (chart.config.type !== 'bar') return;
            if (!chart.options.scales) chart.options.scales = {};
            if (!chart.options.scales.y) chart.options.scales.y = {};
            chart.options.scales.y.max = maxVal;
            chart.update();
        });
    }

        function setChartType(type) {
            currentChartType = type;
        ['pie', 'sankey', 'bar'].forEach(b => {
                const el = document.getElementById(`btn-${b}`);
                if (el) {
                    el.className = b === type ? 'btn btn-primary' : 'btn btn-cancel';
                    el.style.boxShadow = b === type ? '0 2px 4px rgb(0 0 0 / 0.1)' : 'none';
                }
            });

            allData.forEach((d, idx) => {
                if (activeMonths.has(d.month)) {
                    renderChart(idx, d);
                }
            });

        if (type === 'bar') {
            syncBarCharts();
        }
        }

        function isIgnored(t) {
            const descLower = t.description.toLowerCase();
            return overrides.ignored_descriptions.some(d => descLower.includes(d.toLowerCase()));
        }
        
        function renderPage(data, ovrs, duplicates) {
            window.allData = data;
            window.overrides = ovrs || { description_mapping: {}, ignored_descriptions: [], moved_transactions: {}, rename_mapping: {} };
            window.duplicatesData = duplicates || [];

            // Ensure all override keys exist
            overrides.ignored_descriptions = overrides.ignored_descriptions || [];
            overrides.description_mapping = overrides.description_mapping || {};
            overrides.moved_transactions = overrides.moved_transactions || {};
            overrides.rename_mapping = overrides.rename_mapping || {};

            // Clear previous content and reset state
            dynamicContent.innerHTML = '';
        const dupContainer = document.getElementById('duplicatesWarningContainer');
        if (dupContainer) dupContainer.innerHTML = '';
        
        if (window.duplicatesData && window.duplicatesData.length > 0) {
            if (dupContainer) {
                let html = `<div style="background-color: #fef2f2; border: 1px solid #f87171; color: #b91c1c; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">`;
                html += `<h3 style="margin-top: 0; margin-bottom: 0.5rem;">⚠️ Potential Duplicate Transactions Detected</h3>`;
                html += `<ul style="margin-bottom: 0; padding-left: 1.5rem; max-height: 150px; overflow-y: auto;">`;
                window.duplicatesData.forEach(dup => {
                    html += `<li>${dup.date} - ${dup.description} - ${formatCurrency(dup.amount)} (Source: ${dup.source})</li>`;
                });
                html += `</ul></div>`;
                dupContainer.innerHTML = html;
            }
        }
            Object.values(chartInstances).forEach(chart => chart.destroy());
            chartInstances = {};
            currentFilters = {};
            currentSorts = {};
            
            // Keep active months if they still exist, otherwise default
            const existingMonths = new Set(allData.map(d => d.month));
            activeMonths = new Set([...activeMonths].filter(m => existingMonths.has(m)));
            if (activeMonths.size === 0) {
                activeMonths = new Set(allData.slice(0, 1).map(d => d.month));
            }

            // Generate consistent colors for categories across all files
            const categoryColors = {};
            let colorIdx = 0;
            allData.forEach(d => {
                Object.keys(d.totals).forEach(cat => {
                    if (cat === 'Expected!') {
                        categoryColors[cat] = '#000000';
                    } else if (!categoryColors[cat]) {
                        categoryColors[cat] = colorPalette[colorIdx % colorPalette.length];
                        colorIdx++;
                    }
                });
            });
            window.categoryColors = categoryColors; // Make it accessible to renderChart

        // Populate the month selector dropdown
        const selector = document.getElementById("monthSelector");
        if (selector) {
            selector.innerHTML = '<option value="">Select a Month...</option>';
            data.forEach(d => {
                const option = document.createElement("option");
                option.value = d.month;
                option.text = d.month;
                selector.appendChild(option);
            });
        }

            // Create month filter buttons
            const monthFilterContainer = document.getElementById('month-filter-container-placeholder');
            monthFilterContainer.innerHTML = '';
            monthFilterContainer.style.cssText = 'display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap;';
            
            
            allData.forEach(d => {
                const btn = document.createElement('button');
                btn.innerText = d.month;
                btn.className = 'btn';
                btn.style.backgroundColor = activeMonths.has(d.month) ? 'var(--primary)' : '#e2e8f0';
                btn.style.color = activeMonths.has(d.month) ? 'white' : '#475569';
                btn.onclick = () => {
                    if (activeMonths.has(d.month)) {
                        activeMonths.delete(d.month);
                        btn.style.backgroundColor = '#e2e8f0';
                        btn.style.color = '#475569';
                    } else {
                        activeMonths.add(d.month);
                        btn.style.backgroundColor = 'var(--primary)';
                        btn.style.color = 'white';
                    }

                    toggleMonthVisibility();
                };
                monthFilterContainer.appendChild(btn);
            });

            const monthsWrapper = document.createElement('div');
            monthsWrapper.style.cssText = 'display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 2rem; margin-bottom: 2rem; padding-bottom: 1rem;';
            dynamicContent.appendChild(monthsWrapper);

            const bottomTablesContainer = document.createElement('div');
            bottomTablesContainer.style.cssText = 'gap: 2rem; align-items: flex-start; margin-top: 4rem;';
            dynamicContent.appendChild(bottomTablesContainer);

            const overridesContainer = document.createElement('div');
            overridesContainer.style.flex = '1';
            const overridesWrapper = document.createElement('div');
            overridesWrapper.className = 'card';
            overridesWrapper.innerHTML = `
                <h2 style="margin-bottom: 1.5rem;">User Overrides</h2>
                <div style="max-height: 400px; overflow-y: auto;">
                    <table id="overridesTable">
                        <thead><tr><th>Override Rule</th><th style="width: 80px; text-align: center;">Action</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>`;
            overridesContainer.appendChild(overridesWrapper);
            bottomTablesContainer.appendChild(overridesContainer);

            allData.forEach((data, fileIdx) => {
            const monthCol = document.createElement('div');
            monthCol.id = `monthCol-${fileIdx}`;
            monthCol.className = 'month-col';
            monthCol.style.display = 'flex';

            const chartCard = document.createElement('div');
            chartCard.className = 'card';
            chartCard.style.marginBottom = '0';
            chartCard.innerHTML = `
                <h2>${data.month}</h2>
                <div class="chart-container">
                    <canvas id="chart-${fileIdx}" style="display: none;"></canvas>
                    <div id="sankey-${fileIdx}" style="display: none; width: 100%; height: 100%;"></div>
                </div>
            `;
            monthCol.appendChild(chartCard);

            const tableCard = document.createElement('div');
            tableCard.className = 'card';
            tableCard.style.marginBottom = '0';
            tableCard.style.flex = '1'; // Make table card grow
            tableCard.style.display = 'flex';
            tableCard.style.flexDirection = 'column';
            tableCard.innerHTML = `
                <div class="filter-info">
                    <h3 id="title-${fileIdx}">${data.month} - Transactions</h3>
                    <span class="clear-filter" id="clear-${fileIdx}" onclick="resetFilter(${fileIdx})">Clear Filter</span>
                </div>
                <div style="max-height: 500px; overflow-y: auto; flex: 1;">
                    <table id="table-${fileIdx}">
                        <thead>
                            <tr>
                                <th style="cursor: pointer; user-select: none;" onclick="sortTable(${fileIdx}, 'description')" title="Sort by Description">Description ↕</th>
                                <th style="cursor: pointer; user-select: none;" onclick="sortTable(${fileIdx}, 'category')" title="Sort by Category">Category ↕</th>
                                <th style="cursor: pointer; user-select: none;" onclick="sortTable(${fileIdx}, 'amount')" title="Sort by Amount">Amount ↕</th>
                                <th>Edit</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            `;
            monthCol.appendChild(tableCard);
            monthsWrapper.appendChild(monthCol);

            renderTable(fileIdx);
            // Initial chart render for visible months
            if (activeMonths.has(data.month)) {
                renderChart(fileIdx, data);
            }
        });

        toggleMonthVisibility();
        renderOverridesTable();
        }

        function toggleMonthVisibility() {
            allData.forEach((data, fileIdx) => {
                const isVisible = activeMonths.has(data.month);
                const monthCol = document.getElementById(`monthCol-${fileIdx}`);
                
                const wasHidden = monthCol.style.display === 'none';
                monthCol.style.display = isVisible ? 'flex' : 'none';
                
                // Prevent Plotly 0x0 bugs by re-rendering right after becoming visible
                if (isVisible && wasHidden) {
                    renderChart(fileIdx, data);
                } else if (isVisible && !wasHidden) {
                    // Force resize on existing charts if the flex layout changed
                    if (chartInstances[fileIdx] && typeof chartInstances[fileIdx].resize === 'function') {
                        chartInstances[fileIdx].resize();
                    }
                }
            });

    if (currentChartType === 'bar') {
        syncBarCharts();
    }
        }

        function renderTable(fileIdx, filterCategory) {
            const data = allData[fileIdx];
            const tbody = document.querySelector(`#table-${fileIdx} tbody`);
            const title = document.getElementById(`title-${fileIdx}`);
            const clearBtn = document.getElementById(`clear-${fileIdx}`);
            
            if (filterCategory !== undefined) {
                currentFilters[fileIdx] = filterCategory;
            }
            const activeFilter = currentFilters[fileIdx] || null;

            tbody.innerHTML = '';
            
            let tableSum = 0;
            const txs = [];
            data.transactions.forEach((t, origIdx) => {
                if (isIgnored(t)) return;
                
                if (activeFilter) {
                    let isMatch = (t.category === activeFilter);
                    if (t.is_income) {
                        const incMatch = (data.income_breakdown || []).find(inc => inc.desc === t.description);
                        if (incMatch && (incMatch.short_desc || incMatch.desc) === activeFilter) {
                            isMatch = true;
                        } else if (t.description === activeFilter) {
                            isMatch = true;
                        }
                    }
                    if (!isMatch) return;
                }
                
                tableSum += parseFloat(t.amount);
                txs.push({ t, origIdx });
            });
            
            if (!activeFilter) {
                tableSum = Object.values(data.totals).reduce((sum, val) => sum + val, 0);
            }

            if (!currentSorts[fileIdx]) {
                currentSorts[fileIdx] = { col: 'amount', asc: true };
            }

            const sort = currentSorts[fileIdx];
            if (sort) {
                txs.sort((a, b) => {
                    let valA = a.t[sort.col];
                    let valB = b.t[sort.col];
                    if (sort.col === 'amount') {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    } else {
                        valA = valA.toString().toLowerCase();
                        valB = valB.toString().toLowerCase();
                    }
                    if (valA < valB) return sort.asc ? -1 : 1;
                    if (valA > valB) return sort.asc ? 1 : -1;
                    return 0;
                });
            }

            const sumStr = formatCurrency(tableSum);

            if (activeFilter) {
                title.innerText = `${sumStr} - Transactions: ${activeFilter}`;
                const isIncomeFilter = (data.income_breakdown || []).some(inc => (inc.short_desc || inc.desc) === activeFilter);
                title.style.color = isIncomeFilter ? '#16a34a' : (window.categoryColors[activeFilter] || 'inherit');
            } else {
                title.innerText = `${sumStr} - All Transactions`;
                title.style.color = 'inherit';
            }
            clearBtn.style.display = activeFilter ? 'inline' : 'none';

            txs.forEach(({ t, origIdx }) => {
                const tr = document.createElement('tr');
                tr.title = `Source: ${t.source}`;
                const amountVal = parseFloat(t.amount);
                const amountStr = formatCurrency(amountVal);
                const colorStyle = amountVal < 0 ? 'color: red;' : '';
                tr.innerHTML = `
                    <td>${t.description}</td>
                    <td><span class="tag">${t.category}</span></td>
                    <td style="${colorStyle}">${amountStr}</td>
                    <td>
                        <div style="display: flex; gap: 18px; align-items: center; justify-content: center;">
                            <span style="cursor: pointer; font-size: 0.85rem;" onclick="editTransaction(${fileIdx}, ${origIdx})" title="Edit transaction">✏️</span>
                            <span style="cursor: pointer; font-size: 0.85rem;" onclick="openMoveModal(${fileIdx}, ${origIdx})" title="Move transaction to another month">📅</span>
                            <span style="cursor: pointer; font-size: 0.85rem;" onclick="removeTransaction(${fileIdx}, ${origIdx})" title="Remove transaction">❌</span>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function sortTable(fileIdx, col) {
            if (!currentSorts[fileIdx]) {
                currentSorts[fileIdx] = { col: col, asc: true };
            } else if (currentSorts[fileIdx].col === col) {
                currentSorts[fileIdx].asc = !currentSorts[fileIdx].asc;
            } else {
                currentSorts[fileIdx] = { col: col, asc: true };
            }
            renderTable(fileIdx);
        }

        function renderOverridesTable() {
            const tbody = document.querySelector('#overridesTable tbody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const createRow = (text, type, key) => {
                const tr = document.createElement('tr');
                const ruleTd = document.createElement('td');
                ruleTd.innerHTML = text;
                tr.appendChild(ruleTd);

                const actionTd = document.createElement('td');
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-cancel';
                deleteBtn.style.padding = '2px 8px';
                deleteBtn.innerText = 'Delete';
                deleteBtn.onclick = () => deleteOverride(type, key);
                actionTd.appendChild(deleteBtn);
                tr.appendChild(actionTd);
                return tr;
            };

            Object.entries(overrides.description_mapping || {}).forEach(([desc, cat]) => {
                const ruleText = `Recategorize "<em>${truncateDesc(desc)}</em>" as <strong>${cat}</strong>`;
                tbody.appendChild(createRow(ruleText, 'desc', desc));
            });

            (overrides.ignored_descriptions || []).forEach(desc => {
                const ruleText = `Remove transactions matching "<em>${truncateDesc(desc)}</em>"`;
                tbody.appendChild(createRow(ruleText, 'remove', desc));
            });

            Object.entries(overrides.moved_transactions || {}).forEach(([tId, newMonth]) => {
                const desc = tId.split('|')[1];
                const ruleText = `Move "<em>${truncateDesc(desc)}</em>" to <strong>${newMonth}</strong>`;
                tbody.appendChild(createRow(ruleText, 'move', tId));
            });

            Object.entries(overrides.rename_mapping || {}).forEach(([desc, newName]) => {
                const ruleText = `Rename "<em>${truncateDesc(desc)}</em>" to <strong>${newName}</strong>`;
                tbody.appendChild(createRow(ruleText, 'rename', desc));
            });
        }

        function deleteOverride(type, key) {
            let changed = false;
            if (type === 'desc' && overrides.description_mapping[key]) {
                delete overrides.description_mapping[key];
                changed = true;
            } else if (type === 'remove') {
                const index = overrides.ignored_descriptions.indexOf(key);
                if (index > -1) {
                    overrides.ignored_descriptions.splice(index, 1);
                    changed = true;
                }
            } else if (type === 'move' && overrides.moved_transactions[key]) {
                delete overrides.moved_transactions[key];
                changed = true;
            } else if (type === 'rename' && overrides.rename_mapping[key]) {
                delete overrides.rename_mapping[key];
                changed = true;
            }

            if (changed) {
                saveOverridesAndReload();
            }
        }

        function resetFilter(fileIdx) {
            renderTable(fileIdx, null);
        }

        let currentEdit = null;

        function editTransaction(fileIdx, transIdx) {
            const trans = allData[fileIdx].transactions[transIdx];
            currentEdit = { fileIdx, transIdx, trans };
            
            document.getElementById('modalDesc').innerText = `Editing transaction:\n${trans.original_description || trans.description}`;
            document.getElementById('modalCategoryInput').value = trans.category;
            document.getElementById('modalNameInput').value = trans.description;
            document.getElementById('modalMatchInput').value = trans.original_description || trans.description;
            
            document.getElementById('editModal').showModal();
        }

        function closeEditModal() {
            document.getElementById('editModal').close();
            currentEdit = null;
        }

        function applyEdit(type) {
            if (!currentEdit) return;
            const newCat = document.getElementById('modalCategoryInput').value.trim();
            const newName = document.getElementById('modalNameInput').value.trim();
            const trans = currentEdit.trans;
            

            if (type === 'all') {
                const matchStr = document.getElementById('modalMatchInput').value.trim();
                if (!matchStr) {
                    alert("Please provide a substring to match.");
                    return;
                }
                
                let changed = false;
                if (newCat && newCat !== trans.category) {
                    overrides.description_mapping[matchStr] = newCat;
                    changed = true;
                }
                if (newName && newName !== (trans.original_description || trans.description)) {
                    overrides.rename_mapping[matchStr] = newName;
                    changed = true;
                }
                
                if (!changed) {
                    closeEditModal();
                    return;
                }
            }

            saveOverridesAndReload();
            closeEditModal();
        }

        let currentRemove = null;

        function removeTransaction(fileIdx, transIdx) {
            const trans = allData[fileIdx].transactions[transIdx];
            currentRemove = { fileIdx, transIdx, trans };
            document.getElementById('removeModalDesc').innerText = `Remove this transaction and exclude it from reports?\n\n${trans.description}`;
            document.getElementById('removeMatchInput').value = trans.description;
            document.getElementById('removeModal').showModal();
        }

        function closeRemoveModal() {
            document.getElementById('removeModal').close();
            currentRemove = null;
        }

        function applyRemove(type) {
            if (!currentRemove) return;
            const trans = currentRemove.trans;
            if (type === 'all') {
                const matchStr = document.getElementById('removeMatchInput').value.trim();
                if (!matchStr) {
                    alert("Please provide a substring to match.");
                    return;
                }
                if (!overrides.ignored_descriptions.includes(matchStr)) {
                    overrides.ignored_descriptions.push(matchStr);
                }
            }
            closeRemoveModal();
            saveOverridesAndReload();
        }

        function reAddTransaction(desc) {
            const index = (overrides.ignored_descriptions || []).indexOf(desc);
            if (index > -1) {
                overrides.ignored_descriptions.splice(index, 1);
                saveOverridesAndReload();
            }
        }

        let currentMove = null;

        function openMoveModal(fileIdx, transIdx) {
            const trans = allData[fileIdx].transactions[transIdx];
            currentMove = { trans };
            document.getElementById('moveModalDesc').innerText = `Move transaction:\n${trans.description}\nAmount: ${formatCurrency(trans.amount)}\nDate: ${trans.date}`;
            const currentMonth = allData[fileIdx].month;
            document.getElementById('moveModalInput').value = '';
            document.getElementById('moveModalInput').placeholder = `Current month: ${currentMonth}`;
            document.getElementById('moveModal').showModal();
        }

        function closeMoveModal() {
            document.getElementById('moveModal').close();
            currentMove = null;
        }

        function applyMove() {
            if (!currentMove) return;
            const newMonth = document.getElementById('moveModalInput').value.trim();
            if (!/^\d{4}-\d{2}$/.test(newMonth)) {
                alert('Please enter the target month in YYYY-MM format (e.g., 2026-02).');
                return;
            }
            const trans = currentMove.trans;
            const tId = `${trans.date}|${trans.description}|${parseFloat(trans.amount).toFixed(2)}`;
            overrides.moved_transactions[tId] = newMonth;
            saveOverridesAndReload();
            closeMoveModal();
        }

        function saveOverridesAndReload() {
            // Optional: Show a loading indicator
            document.body.style.cursor = 'wait';

            saveOverrides().then(() => {
                return fetch('/data?_t=' + new Date().getTime(), { cache: 'no-store' });
            }).then(res => res.json()).then(newData => {
                renderPage(newData.data, newData.overrides, newData.duplicates);
            }).catch(err => {
                console.error("Error saving and reloading:", err);
                alert("An error occurred while refreshing data. Please check the console.");
            }).finally(() => {
                document.body.style.cursor = 'default';
            });
        }

        function saveOverrides() {
            return fetch('/save_overrides', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(overrides, null, 2)
            }).catch(err => console.error("Error saving overrides:", err));
        }

    function generateReport() {
        const selector = document.getElementById("monthSelector");
        const selectedMonth = selector.value;
        
        if (!selectedMonth) {
            alert("Please select a month first!");
            return;
        }
        
        document.body.style.cursor = 'wait';
        
        fetch("/generate_month_report", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ month: selectedMonth })
        })
        .then(response => {
            if (!response.ok) throw new Error("Network response was not ok");
            return response.json();
        })
        .then(data => {
            alert(data.message);
        })
        .catch(error => {
            console.error("Error generating report:", error);
            alert("Failed to generate report.");
        })
        .finally(() => {
            document.body.style.cursor = 'default';
        });
    }

        function renderChart(fileIdx, data) {
            const ctx = document.getElementById(`chart-${fileIdx}`).getContext('2d');
            const canvas = document.getElementById(`chart-${fileIdx}`);
            const sankeyDiv = document.getElementById(`sankey-${fileIdx}`);

            if (!data) return;
            
            if (currentChartType === 'sankey') {
                canvas.style.display = 'none';
                sankeyDiv.style.display = 'block';
                
                const incomeAgg = {};
                (data.income_breakdown || []).forEach(inc => {
                    const key = inc.short_desc || inc.desc;
                    incomeAgg[key] = (incomeAgg[key] || 0) + parseFloat(inc.amount);
                });
                const incomeKeys = Object.keys(incomeAgg);
                const totalIdx = incomeKeys.length;

                const labels = [...incomeKeys, "Total", ...Object.keys(data.totals)];
                const sources = [];
                const targets = [];
                const values = [];

                // Inflows from Income
                incomeKeys.forEach((incKey, i) => {
                    sources.push(i);
                    targets.push(totalIdx);
                    values.push(incomeAgg[incKey]);
                });

                // Outflows to Expenses
                Object.values(data.totals).forEach((val, i) => {
                    sources.push(totalIdx); // From "Total"
                    targets.push(totalIdx + 1 + i); // To specific category
                    values.push(Math.abs(val));
                });

                const totalIncome = data.income_total;
                const totalExpenses = Object.values(data.totals).reduce((sum, val) => sum + Math.abs(val), 0);
                const net = totalIncome - totalExpenses;
                
                const expectedTotal = Math.abs(data.totals['Expected!'] || 0);
                const restSpending = totalExpenses - expectedTotal;

                const totalNodeColor = net > 0 ? '#16a34a' : '#ef4444';

                const hovertexts = [];
                incomeKeys.forEach(key => {
                    hovertexts.push(`<b>${key}</b><br>${formatCurrency(incomeAgg[key])}<extra></extra>`);
                });
                hovertexts.push(`<b>Total</b><br>In: ${formatCurrency(totalIncome)}<br>Out: ${formatCurrency(-totalExpenses)}<br>Net: ${formatCurrency(net)}<extra></extra>`);
                Object.keys(data.totals).forEach(key => {
                    hovertexts.push(`<b>${key}</b><br>${formatCurrency(data.totals[key])}<extra></extra>`);
                });

                const layout = {
                    margin: { l: 10, r: 10, b: 10, t: 60 },
                    annotations: [{
                        x: 0.5,
                        y: 1.15,
                        xref: 'paper',
                        yref: 'paper',
                        text: `<b><span style="color: #ec4899">${formatCurrency(totalIncome)}</span> - <span style="color: #000000">${formatCurrency(expectedTotal)}</span> - <span style="color: #16a34a">${formatCurrency(restSpending)}</span> = <span style="color: ${net >= 0 ? '#16a34a' : '#ef4444'}">${formatCurrency(net)}</span></b>`,
                        font: { size: 20, color: '#1e293b' },
                        showarrow: false
                    }]
                };

                const sankeyData = [{
                    type: "sankey",
                    orientation: "h",
                    node: {
                        pad: 15,
                        thickness: 20,
                        line: { color: "black", width: 0.5 },
                        label: labels,
                        color: [...incomeKeys.map(() => "#ec4899"), totalNodeColor, ...Object.keys(data.totals).map(cat => window.categoryColors[cat])],
                        hovertext: hovertexts,
                        hoverinfo: 'text'
                    },
                    link: {
                        source: sources,
                        target: targets,
                        value: values,
                        hovertemplate: '$%{value:,.0f}<extra></extra>'
                    }
                }];

                Plotly.newPlot(`sankey-${fileIdx}`, sankeyData, layout, { displayModeBar: false, responsive: true });
                
                if (sankeyDiv.removeAllListeners) {
                    sankeyDiv.removeAllListeners('plotly_click');
                }
                sankeyDiv.on('plotly_click', (event) => {
                    if (event.points && event.points.length > 0) {
                        const pt = event.points[0];
                        if (pt.label && pt.label !== 'Total') {
                            renderTable(fileIdx, pt.label);
                        }
                    }
                });
                return;
            }

            canvas.style.display = 'block';
            sankeyDiv.style.display = 'none';

            if (chartInstances[fileIdx]) {
                chartInstances[fileIdx].destroy();
            }

            const sortedEntries = Object.entries(data.totals)
                .sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));

            const top5 = sortedEntries.slice(0, 5).map(e => e[0]);

            chartInstances[fileIdx] = new Chart(ctx, {
                type: 'pie',
                data: {
                        labels: Object.keys(data.totals),
                        datasets: [{
                            data: Object.values(data.totals).map(v => Math.abs(v)),
                            backgroundColor: Object.keys(data.totals).map(cat => window.categoryColors[cat])
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: 40 },
                        onClick: (evt, item, chart) => {
                        if (item.length > 0) {
                            const index = item[0].index;
                            const label = chart.data.labels[index];
                            renderTable(fileIdx, label);
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    let label = context.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    const realVal = data.totals[context.label];
                                    if (realVal !== undefined) {
                                        label += formatCurrency(realVal);
                                    }
                                    return label;
                                }
                            }
                        },
                        datalabels: {
                            formatter: (value, ctx) => {
                                const label = ctx.chart.data.labels[ctx.dataIndex];
                                return top5.includes(label) ? label : null;
                            },
                            color: '#1e293b',
                            font: { weight: 'bold' },
                            anchor: 'end',
                            align: 'end',
                            offset: 15,
                            display: (ctx) => {
                                const label = ctx.chart.data.labels[ctx.dataIndex];
                                return top5.includes(label);
                            },
                            listeners: {
                                render: (context) => {
                                    const { chart, dataIndex } = context;
                                    const { ctx } = chart;
                                    const meta = chart.getDatasetMeta(0).data[dataIndex];
                                    const { x, y } = meta.tooltipPosition();
                                    
                                    ctx.strokeStyle = '#94a3b8';
                                    ctx.lineWidth = 1;
                                    ctx.beginPath();
                                    ctx.moveTo(meta.x, meta.y);
                                    ctx.lineTo(x, y);
                                    ctx.stroke();
                                }
                            }
                        }
                    }
                }
            });
        }

        renderPage(__DATA_JSON__, __OVERRIDES_JSON__, __DUPLICATES_JSON__);
    </script>
</body>
